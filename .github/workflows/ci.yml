name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Project module to check during proof development
        required: true
        default: GromovFilling.RiemannianControlledBoundaryResonantAction
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Mathlib restores its own cache below. Archiving the whole .lake tree
      # exhausted runner disk space during previous full builds.
      - name: Cache project build
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Check canonical umbrella
        run: ./scripts/check_umbrella.sh

      - name: Check vendored surface foundation
        run: ./scripts/check_surface_vendor.sh

      - name: Check vendored Jordan–Schönflies foundation
        run: ./scripts/check_schoenflies_vendor.sh

      - name: Reject proof escapes
        run: ./scripts/check_no_proof_escapes.sh

      - name: Prove proof-escape gate fails closed
        run: ./scripts/test_proof_escape_gate.sh

      - name: Validate requested Lean module
        if: github.event_name == 'workflow_dispatch'
        env:
          LEAN_TARGET: ${{ inputs.target }}
        run: |
          [[ "$LEAN_TARGET" =~ ^GromovFilling(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]
          test -f "${LEAN_TARGET//.//}.lean"

      - name: Build changed Lean leaf
        if: github.event_name == 'workflow_dispatch'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: ${{ inputs.target }}
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: false

      - name: Build Lean project
        if: github.event_name != 'workflow_dispatch'
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          axiom-audit: true
          axiom-audit-allow: propext,Classical.choice,Quot.sound
          axiom-audit-root: GromovFilling
