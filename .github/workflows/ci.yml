name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: GromovFilling for the full audit, or a development module
        required: true
        default: GromovFilling
        type: string
      pristine:
        description: Rebuild project sources without restoring project oleans
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Mathlib restores its own cache below. Archiving the whole .lake tree
      # exhausted runner disk space during previous full builds.
      - name: Cache project build
        if: ${{ !inputs.pristine }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-

      - name: Check canonical umbrella
        run: ./scripts/check_umbrella.sh

      - name: Check vendored surface foundation
        run: ./scripts/check_surface_vendor.sh

      - name: Check vendored Jordan–Schönflies foundation
        run: ./scripts/check_schoenflies_vendor.sh

      - name: Reject proof escapes
        run: ./scripts/check_no_proof_escapes.sh

      - name: Prove proof-escape gate fails closed
        run: ./scripts/test_proof_escape_gate.sh

      - name: Validate requested Lean module
        if: github.event_name == 'workflow_dispatch'
        env:
          LEAN_TARGET: ${{ inputs.target }}
        run: |
          [[ "$LEAN_TARGET" =~ ^GromovFilling(\.[A-Za-z][A-Za-z0-9_]*)*$ ]]
          test -f "${LEAN_TARGET//.//}.lean"

      - name: Build changed Lean leaf
        if: github.event_name == 'workflow_dispatch' && inputs.target != 'GromovFilling'
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: true
          build-args: ${{ inputs.target }}
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: false

      - name: Build Lean project
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'GromovFilling'
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          use-github-cache: false
          axiom-audit: false

      - name: Audit complete environment and verify source receipt
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'GromovFilling'
        run: ./scripts/audit_axioms.sh

      - name: Preserve verification evidence
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.target == 'GromovFilling')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error
