name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check canonical umbrella
        run: ./scripts/check_umbrella.sh

      - name: Check vendored surface foundation
        run: ./scripts/check_surface_vendor.sh

      - name: Check vendored Jordan–Schönflies foundation
        run: ./scripts/check_schoenflies_vendor.sh

      - name: Reject proof escapes
        run: ./scripts/check_no_proof_escapes.sh

      - name: Prove proof-escape gate fails closed
        run: ./scripts/test_proof_escape_gate.sh

      - name: Build changed Lean leaf
        if: github.event_name == 'workflow_dispatch'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: GromovFilling.RiemannianControlledBoundaryParameterLipschitz
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: false

      - name: Build Lean project
        if: github.event_name != 'workflow_dispatch'
        uses: leanprover/lean-action@v1
        with:
          axiom-audit: true
          axiom-audit-allow: propext,Classical.choice,Quot.sound
          axiom-audit-root: GromovFilling
