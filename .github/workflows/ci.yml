name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Lean project
        uses: leanprover/lean-action@v1

      - name: Reject proof placeholders
        shell: bash
        run: |
          if rg -n '\b(sorry|admit|axiom|unsafe)\b' \
              --glob '*.lean' GromovFilling GromovFilling.lean; then
            echo 'Lean proof placeholder or unsafe declaration found.'
            exit 1
          fi
