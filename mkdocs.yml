site_name: Fourier bounds for Gromov's filling-area problem
site_description: Lean-verified Fourier, topology, and certificate arguments for Gromov's filling-area problem.
site_url: https://lowrank.github.io/gromov-filling-lower-bound/
repo_url: https://github.com/lowrank/gromov-filling-lower-bound
repo_name: lowrank/gromov-filling-lower-bound
edit_uri: edit/main/docs/

theme:
  name: material
  font: false
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy

nav:
  - Home: index.md
  - Mathematics: mathematics.md
  - Formalization: formalization.md
  - Current manuscript: current-manuscript.md
  - Revised Section 4: section4.md
  - Lean modules: modules.md
  - Verify: verification.md
  - Manuscript: manuscript.md
  - Reusable libraries: library-contributions.md
  - Contribute: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lowrank/gromov-filling-lower-bound
      name: Repository on GitHub

copyright: Copyright 2026 Yimin Zhong and contributors. MIT License.

strict: true
